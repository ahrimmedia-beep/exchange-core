# Local Postgres for the optional ledger integration test:
#   docker compose up -d
#   DATABASE_URL=postgres://exchange:exchange@localhost:5432/exchange pnpm test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange"]
      interval: 2s
      retries: 15
